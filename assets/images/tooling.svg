<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#f5f3ff"/><g font-family="monospace" font-size="34" fill="#0b1220"><text x="90" y="260">T_i = A_i(q_i)</text><text x="90" y="315">M(q)q'' + C(q,q')q' + g(q) = tau</text><text x="90" y="370">q = IK(x, psi)</text><text x="90" y="425">tau = RNEA(q, q', q'')</text></g><g transform="translate(945 330)" stroke="#2563eb" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-170 150l45-160 115-75 100 110 95-145"/><circle cx="-125" cy="-10" r="25" fill="#60a5fa"/><circle cx="-10" cy="-85" r="25" fill="#60a5fa"/><circle cx="90" cy="25" r="25" fill="#60a5fa"/></g><text x="70" y="100" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#0b1220">ROBOTICS TOOLING</text><text x="70" y="150" font-family="Arial,sans-serif" font-size="28" fill="#52647d">Automatic symbolic kinematics and dynamics</text></svg>